services:
  pocketbase:
    build: .
    container_name: zilya-pocketbase
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@zilyadigital.local}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-admin123456}
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
    command: >
      sh -c "/pb/pocketbase superuser upsert "$$PB_SUPERUSER_EMAIL" "$$PB_SUPERUSER_PASSWORD" || true;
             exec /pb/pocketbase serve --http=0.0.0.0:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
